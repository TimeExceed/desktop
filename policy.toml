[[tasks]]
id = "nopasswd-sudo"
display-name = "sudo 免密"

[[tasks.steps]]
id = "copy-files"
dest-dir = "/etc/sudoers.d/"
files = [
    "nopasswd-sudo/sudoers.d/taoda",
]
run-as-root = true

[[tasks.steps]]
id = "manual-check"
prompt = """
请执行 `sudo -n true`，若无需密码即返回成功，则确认。
"""


