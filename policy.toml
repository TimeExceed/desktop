[[tasks.steps]]
id = "reboot"
prompt = """
恢复Xfce桌面设置。重启后生效。
"""

[[tasks.steps]]
id = "manual-check"
prompt = """
请逐项检查Xfce桌面：
- 是否有两块屏幕，外接屏（Dell）在上，主屏幕（eDP）在下。
- 是否只有一个 panel，且该 panel 出现在主屏幕的顶端。
- panel 上顺序是 whisper-menu、notes、window-button、工作区、CPU 图像、网络监控、状态栏、音量和时钟。
"""

[[tasks.steps]]
id = "manual-check"
prompt = """
请逐项检查Xfce桌面：
- whisper-menu 的布局是否熟悉。
- notes 的内容是否和重装之前一样。
- 设置/屏幕保护：
  + 是否关闭屏保？
- 设置/电源管理：
  + 按下电源按钮时，是否关机？
  + 系统：无论电池还是电源，合上笔记本盖时是否什么都不做？
  + 显示：无论电池还是电源，是否关闭显示电源管理，是否亮度降低是“100%”和“从不”。
"""

[[tasks.steps]]
id = "manual-check"
prompt = """
请逐项检查Xfce桌面快捷键：
- win-1/2/3/4：切换四工作区
- alt-win-1/2/3/4：窗口搬至四工作区
- ctrl-esc：呼出whisper-menu
- alt-tab：切换窗口
- win-tab：切换同程序下窗口
"""


