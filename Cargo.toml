[package]
name = "fedora-setup"
version = "0.1.0"
edition = "2024"

[profile.release]
panic = "abort"

[dependencies]
anyhow = "1"
clap = {version = "4", features = ["cargo"]}
env_logger = "0.11"
jsonschema = {version="0.60", default-features=false}
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
rust-yaml = { version = "1.1.0", features = ["serde"] }
toml = "1.2.0"

[dev-dependencies]
tempfile = "3.27"

